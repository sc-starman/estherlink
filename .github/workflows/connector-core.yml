name: connector-core

on:
  push:
    paths:
      - "src/OmniRelay.ConnectorCore/**"
      - "scripts/test_connector_core_linux_smoke.sh"
      - "scripts/test_connector_core_migration_smoke.sh"
      - ".github/workflows/connector-core.yml"
  pull_request:
    paths:
      - "src/OmniRelay.ConnectorCore/**"
      - "scripts/test_connector_core_linux_smoke.sh"
      - "scripts/test_connector_core_migration_smoke.sh"
      - ".github/workflows/connector-core.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: src/OmniRelay.ConnectorCore/go.sum
      - name: Unit tests
        working-directory: src/OmniRelay.ConnectorCore
        run: go test ./...
      - name: Build Linux architectures
        working-directory: src/OmniRelay.ConnectorCore
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/connector-core-amd64 ./cmd/connector-core
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/connector-core-arm64 ./cmd/connector-core
      - name: Linux apply/idempotency smoke test
        run: bash scripts/test_connector_core_linux_smoke.sh /tmp/connector-core-amd64
      - name: Linux migration lifecycle smoke test
        run: bash scripts/test_connector_core_migration_smoke.sh /tmp/connector-core-amd64
